<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Rewards</title><style>body{font:16px Arial;background:#f2f5f9;color:#172638;margin:0}header{background:#10243b;color:white;padding:18px 6%;font-size:22px;font-weight:bold}header span{color:#f4bd4b}main{max-width:650px;margin:28px auto;padding:0 15px}.card{background:white;border:1px solid #dfe6ee;border-radius:14px;padding:24px}label{display:block;font-weight:bold;margin:13px 0 5px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;box-sizing:border-box}button,.btn{display:inline-block;background:#1769aa;color:white;border:0;border-radius:8px;padding:12px 16px;margin-top:16px;text-decoration:none;font-weight:bold}.flash{background:#fff4dc;padding:10px;border-radius:8px;color:#674b0b}.muted{color:#64748b;font-size:13px}</style></head><body><header>SMART <span>REWARDS</span></header><main><div class="card">{% with messages = get_flashed_messages() %}{% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}{% endwith %}{% block body %}{% endblock %}</div><p class="muted">Starter application only. No earnings, payments or rewards are active.</p></main></body></html>
