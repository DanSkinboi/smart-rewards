{% extends "base.html" %}{% block body %}<h1>Create member account</h1><form method="post"><label>Full name</label><input name="full_name" required maxlength="100"><label>Phone number</label><input name="phone" required maxlength="30"><label>Country</label><select name="country" required><option value="Nigeria">Nigeria</option><option value="Cameroon">Cameroon</option></select><label>Email (optional)</label><input type="email" name="email" maxlength="254"><label>Password (minimum 10 characters)</label><input type="password" name="password" required minlength="10"><button type="submit">Register</button></form><p><a href="{{ url_for('login') }}">Already registered? Log in</a></p>{% endblock %}
